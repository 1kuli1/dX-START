<h1>DX AI – Nivå 1</h1>

<!-- IDENTIFIERA STATION -->
<div class="container">
<h2>Identifiera station</h2>

<input id="freq" aria-label="Frekvens kHz" placeholder="Frekvens (kHz)">
<input id="utc" aria-label="UTC" placeholder="UTC">
<input id="lang" aria-label="Språk" placeholder="Språk">
<textarea id="obs" aria-label="Observationer" placeholder="Vad hör du?"></textarea>

<br>
<button onclick="utcNow()">UTC nu</button>
<button onclick="stationAI()">Till fri AI</button>

<div id="out1" class="output"></div>
</div>

<!-- STÖRNING -->
<div class="container">
<h2>Störning / signal</h2>

<select id="type" aria-label="Typ av störning">
<option value="">Välj typ</option>
<option>Brus</option>
<option>Fading</option>
<option>Vissling</option>
<option>Brum</option>
<option>Interferens</option>
</select>

<textarea id="desc" aria-label="Beskrivning" placeholder="Beskrivning"></textarea>

<button onclick="interferenceAI()">Till fri AI</button>

<div id="out2" class="output"></div>
</div>

<!-- EGEN FRÅGA -->
<div class="container">
<h2>Egen fråga</h2>

<textarea id="question" aria-label="Egen fråga" placeholder="Skriv din fråga"></textarea>

<button onclick="questionAI()">Till fri AI</button>

<div id="out3" class="output"></div>
</div>

<script>
function utcNow(){
    let d = new Date();
    let h = String(d.getUTCHours()).padStart(2,'0');
    let m = String(d.getUTCMinutes()).padStart(2,'0');
    document.getElementById("utc").value = h+":"+m+" UTC";
}

function openAI(text){
    navigator.clipboard?.writeText(text).catch(()=>{});
    window.open("https://chatgpt.com/","_blank","noopener");
}

function stationAI(){
    let prompt = `Du är en pedagogisk DX-expert.\n\nFörklara enkelt.\nVar tydlig.\nAnge källa och länk om möjligt.\nSäg till om du är osäker.\n\nIdentifiera station:\nFrekvens: ${freq.value}\nTid: ${utc.value}\nSpråk: ${lang.value}\nObservationer: ${obs.value}`;
    out1.innerText = prompt;
    openAI(prompt);
}

function interferenceAI(){
    let prompt = `Du är en pedagogisk DX-expert.\n\nFörklara enkelt.\nVar tydlig.\nAnge källa och länk om möjligt.\nSäg till om du är osäker.\n\nFörklara signal:\nTyp: ${type.value}\nBeskrivning: ${desc.value}`;
    out2.innerText = prompt;
    openAI(prompt);
}

function questionAI(){
    let q = question.value;
    out3.innerText = q;
    openAI(q);
}
</script>

<script>if('serviceWorker' in navigator&&location.protocol==='https:')window.addEventListener('load',()=>navigator.serviceWorker.register('../sw.js',{scope:'../'}).catch(e=>console.warn(e)));</script></body>
