name: DX Centralen – kontroll av kod och loggar
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Hämta programkod
        uses: actions/checkout@v4
      - name: Installera Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installera testberoenden
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Kör kod- och säkerhetstester
        run: npm test

